name: Probe bulk secret
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FREE_PROVIDER_API_KEYS: ${{ secrets.FREE_PROVIDER_API_KEYS }}
      TEST_STDIN: ${{ secrets.FREE_PROVIDER_API_KEYS_TEST }}
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import os
          for n in ("FREE_PROVIDER_API_KEYS","TEST_STDIN"):
              raw=os.environ.get(n,"")
              print(n,"len:",len(raw))
          PY
