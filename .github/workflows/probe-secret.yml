name: Probe bulk secret
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FREE_PROVIDER_API_KEYS: ${{ secrets.FREE_PROVIDER_API_KEYS }}
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import os, json
          raw = os.environ.get("FREE_PROVIDER_API_KEYS", "")
          print("len:", len(raw))
          print("first chars:", repr(raw[:20]))
          try:
              json.loads(raw)
              print("json: OK")
          except Exception as exc:
              print("json: FAIL", exc)
          PY
