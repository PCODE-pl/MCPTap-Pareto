name: Probe bulk secret
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FREE_PROVIDER_API_KEYS: ${{ secrets.FREE_PROVIDER_API_KEYS }}
      FREE_PROVIDER_API_KEYS_TEST: ${{ secrets.FREE_PROVIDER_API_KEYS_TEST }}
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import os, json
          for name in ("FREE_PROVIDER_API_KEYS", "FREE_PROVIDER_API_KEYS_TEST"):
              raw = os.environ.get(name, "")
              print(name, "len:", len(raw))
              try:
                  json.loads(raw)
                  print(name, "json: OK")
              except Exception as exc:
                  print(name, "json: FAIL", exc)
          PY
