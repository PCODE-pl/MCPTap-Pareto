name: Compile Pareto data

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      accuracy_threshold:
        description: "Minimum OpenRouter accuracy as a fraction"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: compile-pareto-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PARETO_ACCURACY_THRESHOLD: ${{ inputs.accuracy_threshold || vars.PARETO_ACCURACY_THRESHOLD || '0.60' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Pareto data
        run: python .github/scripts/compile_pareto_data.py

      - name: Commit changed Pareto data
        run: |
          if git diff --quiet -- pareto.json; then
            echo "pareto.json is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pareto.json
          git commit -m "chore: update Pareto data"
          git push origin HEAD:${GITHUB_REF_NAME}
