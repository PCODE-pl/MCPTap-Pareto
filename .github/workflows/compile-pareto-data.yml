name: Compile Pareto data

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      accuracy_threshold:
        description: "Minimum OpenRouter coding_index in points from 0 to 100"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: compile-pareto-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PARETO_ACCURACY_THRESHOLD: ${{ inputs.accuracy_threshold || vars.PARETO_ACCURACY_THRESHOLD || '60' }}
      EXCLUDE_PROVIDERS_WITH_PLAN: ${{ vars.EXCLUDE_PROVIDERS_WITH_PLAN || 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Requesty model prices
        run: python .github/scripts/sync_requesty_models.py

      - name: Compile Pareto data
        run: python .github/scripts/compile_pareto_data.py

      - name: Commit changed Pareto and Requesty data
        run: |
          if test -z "$(git status --porcelain -- pareto.json providers/requesty/models)"; then
            echo "Pareto and Requesty data are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- pareto.json providers/requesty/models
          git commit -m "chore: update Pareto and Requesty data"
          git push origin HEAD:${GITHUB_REF_NAME}
