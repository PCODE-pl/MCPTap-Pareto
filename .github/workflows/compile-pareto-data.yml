name: Compile Pareto data

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      accuracy_threshold:
        description: "Minimum OpenRouter coding_index in points from 0 to 100"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: compile-pareto-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PARETO_ACCURACY_THRESHOLD: ${{ inputs.accuracy_threshold || vars.PARETO_ACCURACY_THRESHOLD || '60' }}
      EXCLUDE_PROVIDERS_WITH_PLAN: ${{ vars.EXCLUDE_PROVIDERS_WITH_PLAN || 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout shared pre-commit hooks
        uses: actions/checkout@v4
        with:
          repository: PCODE-pl/MCPTap-Extras
          token: ${{ secrets.GITHUB_TOKEN }}
          path: mcp-tap-extras
          fetch-depth: 1

      - name: Link shared pre-commit hooks
        run: |
          set -euo pipefail

          hooks_link="${GITHUB_WORKSPACE}/../mcp-tap-extras"
          if [ -L "${hooks_link}" ]; then
            rm "${hooks_link}"
          elif [ -e "${hooks_link}" ]; then
            echo "Expected ${hooks_link} to be absent or a symlink" >&2
            exit 1
          fi
          ln -s "${GITHUB_WORKSPACE}/mcp-tap-extras" "${hooks_link}"

      - name: Sync catalog from upstream models.dev
        run: |
          set -euo pipefail

          git fetch --no-tags https://github.com/anomalyco/models.dev.git dev
          merge_base="$(git merge-base HEAD FETCH_HEAD)"
          applied=0
          removed=0
          missing=0

          while IFS= read -r -d '' path; do
            # Upstream is authoritative for every path it changed. This intentionally
            # overwrites fork changes in the same path and removes upstream deletions.
            if git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
              git checkout FETCH_HEAD -- "$path"
              applied=$((applied + 1))
            elif git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              git rm -f -- "$path"
              removed=$((removed + 1))
            else
              echo "Upstream path is already absent locally: $path"
              missing=$((missing + 1))
            fi
          done < <(git diff --name-only -z "$merge_base" FETCH_HEAD -- models providers)

          echo "Applied upstream catalog paths: $applied"
          echo "Removed upstream catalog paths: $removed"
          echo "Already absent locally: $missing"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up pre-commit
        run: |
          python -m pip install --disable-pip-version-check \
            pre-commit \
            ruff \
            "lingua-language-detector>=2.0"
          npm install --global markdownlint-cli2@0.23.2
          pre-commit install --install-hooks --hook-type pre-commit --hook-type post-commit

      - name: Sync Requesty model prices
        run: python .github/scripts/sync_requesty_models.py

      - name: Get provider model stats from OpenRouter
        run: python .github/scripts/get_provider_model_stats_from_openrouter.py

      - name: Get provider model stats from Vercel
        run: python .github/scripts/get_provider_model_stats_from_vercel.py

      - name: Compute average provider model stats
        run: python .github/scripts/compute_average_provider_model_stats.py

      - name: Compile Pareto data
        run: python .github/scripts/compile_pareto_data.py

      - name: Commit changed catalog and generated data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0

          if test -z "$(git status --porcelain -- models providers stats pareto.json .requesty_ai_mapping_cache.json)"; then
            echo "Catalog and generated data are unchanged."
            exit 0
          fi

          if [[ -z "${GITHUB_TOKEN:-}" ]]; then
            echo "GITHUB_TOKEN is required to publish generated data." >&2
            exit 1
          fi
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: bearer ${GITHUB_TOKEN}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- models providers stats pareto.json .requesty_ai_mapping_cache.json
          git commit -m "chore: sync upstream catalog and generated data"

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            push_output="$(mktemp)"
            if timeout --signal=TERM 120s git push origin "HEAD:${GITHUB_REF_NAME}" >"$push_output" 2>&1; then
              cat "$push_output"
              rm -f "$push_output"
              echo "Catalog and generated data pushed successfully."
              exit 0
            fi
            cat "$push_output" >&2

            if grep -Eqi "authentication failed|could not read Username|terminal prompts disabled|permission denied|invalid username|HTTP 40[13]" "$push_output"; then
              rm -f "$push_output"
              echo "GitHub authentication failed; refusing to retry push." >&2
              exit 1
            fi

            if ! grep -Eqi "rejected|non-fast-forward|fetch first|remote contains work" "$push_output"; then
              rm -f "$push_output"
              echo "Git push failed for a non-retryable reason." >&2
              exit 1
            fi
            rm -f "$push_output"

            if test "$attempt" -eq "$max_attempts"; then
              echo "Unable to push after ${max_attempts} attempts."
              exit 1
            fi

            echo "Remote branch advanced during push; rebasing and retrying."
            git fetch --no-tags origin "${GITHUB_REF_NAME}"
            had_local_changes=false
            if ! git diff --quiet || ! git diff --cached --quiet || test -n "$(git ls-files --others --exclude-standard)"; then
              had_local_changes=true
              git stash push --include-untracked -m "preserve local changes before push rebase"
            fi
            if ! GIT_EDITOR=: git rebase "origin/${GITHUB_REF_NAME}"; then
              echo "Automatic rebase failed; refusing to overwrite remote changes." >&2
              git rebase --abort || true
              if [[ "$had_local_changes" == true ]]; then
                git stash pop || true
              fi
              git status --short
              exit 1
            fi
            if [[ "$had_local_changes" == true ]] && ! git stash pop; then
              echo "Unable to restore local changes after push rebase." >&2
              git status --short
              exit 1
            fi
            sleep $((attempt * 2))
          done
