name: Compile Pareto data

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      accuracy_threshold:
        description: "Minimum OpenRouter coding_index in points from 0 to 100"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: compile-pareto-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PARETO_ACCURACY_THRESHOLD: ${{ inputs.accuracy_threshold || vars.PARETO_ACCURACY_THRESHOLD || '60' }}
      EXCLUDE_PROVIDERS_WITH_PLAN: ${{ vars.EXCLUDE_PROVIDERS_WITH_PLAN || 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync catalog from upstream models.dev
        run: |
          set -euo pipefail

          git fetch --no-tags https://github.com/anomalyco/models.dev.git dev
          merge_base="$(git merge-base HEAD FETCH_HEAD)"
          applied=0
          skipped=0

          while IFS= read -r -d '' path; do
            # Never overwrite a path changed by the fork. Apply upstream changes
            # only when the fork still has the merge-base version.
            fork_changed=false
            if ! git diff --quiet "$merge_base" HEAD -- "$path"; then
              fork_changed=true
            fi
            if git ls-files --others --exclude-standard -- "$path" | grep -q .; then
              fork_changed=true
            fi

            if [ "$fork_changed" = true ]; then
              echo "Skipped upstream change for fork-modified path: $path"
              skipped=$((skipped + 1))
              continue
            fi

            if git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
              git checkout FETCH_HEAD -- "$path"
            elif git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              git rm -f -- "$path"
            else
              echo "Skipped upstream deletion of non-tracked path: $path"
              skipped=$((skipped + 1))
              continue
            fi
            applied=$((applied + 1))
          done < <(git diff --name-only -z "$merge_base" FETCH_HEAD -- models providers)

          echo "Applied upstream catalog paths: $applied"
          echo "Skipped fork-modified paths: $skipped"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Requesty model prices
        run: python .github/scripts/sync_requesty_models.py

      - name: Compile Pareto data
        run: python .github/scripts/compile_pareto_data.py

      - name: Commit changed catalog and generated data
        run: |
          if test -z "$(git status --porcelain -- models providers pareto.json)"; then
            echo "Catalog and generated data are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- models providers pareto.json
          git commit -m "chore: sync upstream catalog and generated data"
          git push origin HEAD:${GITHUB_REF_NAME}
